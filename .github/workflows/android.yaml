name: "Android build"

# Builds test APKs for every push and on demand, so a branch can be tried on a
# phone without opening a pull request or cutting a release.
on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: "Build Android APK"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      # Without the secrets (e.g. on forks) the placeholders stay, rather than
      # being blanked out.
      - name: Inject DanDan API Credentials
        env:
          DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
          DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
        run: |
          if [ -n "$DANDANAPI_APPID" ] && [ -n "$DANDANAPI_KEY" ]; then
            sed -i "s/kvpx7qkqjh/${DANDANAPI_APPID}/g" lib/utils/mortis.dart
            sed -i "s/rABUaBLqdz7aCSi3fe88ZDj2gwga9Vax/${DANDANAPI_KEY}/g" lib/utils/mortis.dart
          else
            echo "::warning::DanDan API secrets are not set, using the built-in credentials"
          fi

      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          short_sha="${GITHUB_SHA::7}"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "dist/oneAnime_android_${abi}_${short_sha}.apk"
          done
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: oneAnime_android_${{ github.sha }}
          path: dist/*.apk
          retention-days: 14
