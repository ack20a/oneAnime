name: "Test builds"

# Builds test APKs and an unsigned IPA for every push and on demand, so a
# branch can be tried on a phone without opening a pull request or cutting a
# release.
on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

concurrency:
  group: test-builds-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: "Build Android APK"
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Get Flutter dependencies
        run: flutter pub get

      # Without the secrets (e.g. on forks) the placeholders stay, rather than
      # being blanked out.
      - name: Inject DanDan API Credentials
        env:
          DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
          DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
        run: |
          if [ -n "$DANDANAPI_APPID" ] && [ -n "$DANDANAPI_KEY" ]; then
            sed -i "s/kvpx7qkqjh/${DANDANAPI_APPID}/g" lib/utils/mortis.dart
            sed -i "s/rABUaBLqdz7aCSi3fe88ZDj2gwga9Vax/${DANDANAPI_KEY}/g" lib/utils/mortis.dart
          else
            echo "::warning::DanDan API secrets are not set, using the built-in credentials"
          fi

      - name: Build APKs
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          short_sha="${GITHUB_SHA::7}"
          mkdir -p dist
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "dist/oneAnime_android_${abi}_${short_sha}.apk"
          done
          ls -l dist

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: oneAnime_android_${{ github.sha }}
          path: dist/*.apk
          retention-days: 14

  build-ios:
    name: "Build iOS IPA (unsigned)"
    runs-on: macos-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Inject DanDan API Credentials
        env:
          DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID }}
          DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY }}
        run: |
          if [ -n "$DANDANAPI_APPID" ] && [ -n "$DANDANAPI_KEY" ]; then
            sed -i '' "s/kvpx7qkqjh/${DANDANAPI_APPID}/g" lib/utils/mortis.dart
            sed -i '' "s/rABUaBLqdz7aCSi3fe88ZDj2gwga9Vax/${DANDANAPI_KEY}/g" lib/utils/mortis.dart
          fi

      - name: Build app
        run: flutter build ios --release --no-codesign

      # Unsigned: it has to be re-signed for a device before it installs.
      - name: Package IPA
        run: |
          short_sha="${GITHUB_SHA::7}"
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/Runner.app
          (cd dist && zip -q -r -y "oneAnime_ios_unsigned_${short_sha}.ipa" Payload && rm -rf Payload)
          ls -l dist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: oneAnime_ios_${{ github.sha }}
          path: dist/*.ipa
          retention-days: 14

  # Artifacts need a GitHub login and arrive zipped, which is awkward on a
  # phone. Keep one prerelease per branch whose files download directly.
  publish:
    name: "Publish test prerelease"
    needs: [build-android, build-ios]
    # A broken iOS build should not hold back the APKs.
    if: ${{ !cancelled() && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          branch="${GITHUB_REF_NAME}"
          tag="canary-$(echo "$branch" | tr -c 'A-Za-z0-9._-' '-' | sed 's/-*$//')"
          short_sha="${GITHUB_SHA::7}"
          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "测试版 ${branch} (${short_sha})" \
            --notes "分支 \`${branch}\` 提交 ${short_sha} 的自动构建，仅供测试。安卓大多数手机下载 arm64-v8a 版本即可；iOS 的 IPA 未签名，需要重新签名后才能安装。"
